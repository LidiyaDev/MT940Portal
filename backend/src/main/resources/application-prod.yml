# Oracle production profile.
spring:
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/MT940PDB}
    username: ${ORACLE_USER:MT940_APP}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    # Schema is owned by Flyway (db/migration). Hibernate must not touch it.
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: JVM
        order_inserts: true
        order_updates: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

mt940:
  security:
    dev-bypass:
      enabled: false

logging:
  level:
    com.bank.mt940portal: INFO
